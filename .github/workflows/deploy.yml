name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, sqlite3

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # laravel-vite calls `php artisan vite:config` to discover entrypoints,
      # so the Laravel app must boot. It never touches the DB, but the console
      # kernel still needs a bootable environment.
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          echo "DB_CONNECTION=sqlite" >> .env
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: yarn

      - name: Install frontend dependencies
        # The project uses yarn (yarn.lock); package-lock.json is stale.
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build frontend
        run: npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Upload frontend assets
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build/*"
          target: "/root/crater/public/build-new"
          strip_components: 2
          rm: true
          overwrite: true

      # Atomic swap: the old assets stay served until both the new code and
      # the new manifest are in place, so there is never a window where
      # public/build/manifest.json is missing.
      - name: Sync code on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/crater

            if [ ! -f public/build-new/manifest.json ]; then
              echo "FATAL: public/build-new is missing, the scp step failed"
              ls -la public/
              exit 1
            fi

            git pull origin master

            rm -rf public/build-old
            mv public/build public/build-old
            mv public/build-new public/build

            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan route:clear

            echo "Deployed commit: $(git rev-parse --short HEAD)"
            echo "Deployed manifest main entry:"
            grep -o 'main\.[a-z0-9]*\.js' public/build/manifest.json | head -1
