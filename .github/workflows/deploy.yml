name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/crater

            git pull

            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            # Build frontend (php is shimmed to the app container via .docker-bin)
            mkdir -p .docker-bin
            printf '#!/bin/sh\nexec docker compose exec -T app php "$@"\n' > .docker-bin/php
            chmod +x .docker-bin/php
            PATH="$PWD/.docker-bin:$PATH" yarn install --frozen-lockfile
            PATH="$PWD/.docker-bin:$PATH" yarn build

            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan route:clear
