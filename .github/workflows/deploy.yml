name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/crater

            # Frontend assets are built locally and committed to public/build,
            # so no build is needed on the droplet (it OOM-kills on small instances).
            git pull

            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan route:clear
